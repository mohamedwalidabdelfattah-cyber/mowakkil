<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070C18">
  <title>بوابة الموكل — مُوكِّل</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/app/favicon-48.png">

  <!-- تطبيق مستقل للموكل (مش اختصار): manifest خاص بيفتح على البوابة مباشرة -->
  <link rel="manifest" href="/client/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/app/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="بوابة الموكل">
  <script>
    // لازم نمسك حدث التثبيت بدري قبل ما الموديولات تحمل
    window.__installPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__installPrompt = e;
      document.dispatchEvent(new Event('portal:installable'));
    });
    window.addEventListener('appinstalled', function () {
      window.__installPrompt = null;
      document.dispatchEvent(new Event('portal:installed'));
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('/service-worker.js').catch(function () {}); });
    }
  </script>
  
  <link rel="stylesheet" href="/assets/fonts.css">
  <!-- نفس هوية التطبيق (توكنز theme.css) — ملف واحد خاص بالبوابة -->
  <link rel="stylesheet" href="/client/assets/styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img id="office-logo" class="office-logo" alt="" hidden>
    <span id="office-name" class="brand-name">بوابة الموكل</span>
  </div>
  <div class="topbar-actions">
    <button class="install-btn" id="install-btn" hidden title="نزّل التطبيق على جهازك" aria-label="تثبيت التطبيق">
      <svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>تثبيت التطبيق</span>
    </button>
    <button class="install-btn" id="settings-btn" hidden title="الإعدادات">⚙️</button>
    <button class="logout-btn" id="logout-btn" hidden>خروج</button>
  </div>
</header>

<div id="login-gate" class="gate">
  <div class="gate-card">
    <div class="gate-icon">⚖️</div>
    <h1 id="login-office-name">بوابة الموكل</h1>
    <p class="gate-subtitle">تسجيل الدخول لمتابعة تطورات قضاياك، مواعيد الجلسات، والفواتير</p>

    <label for="lg-email">رقم الهاتف أو البريد الإلكتروني</label>
    <input id="lg-email" type="text" placeholder="01xxxxxxxxx" autocomplete="username">

    <label for="lg-pass" style="margin-top:14px">كلمة المرور</label>
    <input id="lg-pass" type="password" autocomplete="current-password">

    <button class="primary" id="login-btn" style="width:100%;margin-top:20px;padding:14px">تسجيل الدخول</button>
    <div id="lg-status" class="status"></div>

    <div class="gate-help">
      💡 يتم تزويدك ببيانات الدخول مباشرة من مكتب المحاماة الموكل بقضاياك.
    </div>
  </div>
</div>

<div id="invite-gate" class="gate" hidden>
  <div class="gate-card">
    <div class="gate-icon">⚖️</div>
    <h1>مرحباً بك</h1>
    <p class="gate-subtitle" id="invite-message">تمت دعوتك للوصول إلى البوابة الرقمية للمكتب</p>
    <div class="invite-info" id="invite-info"></div>

    <label style="margin-top:16px">اختر كلمة المرور الجديدة (8 خانات على الأقل)</label>
    <input id="iv-pass" type="password" placeholder="••••••••">

    <label style="margin-top:12px">تأكيد كلمة المرور</label>
    <input id="iv-pass2" type="password" placeholder="••••••••">

    <button class="primary" id="accept-btn" style="width:100%;margin-top:20px;padding:14px">تفعيل الحساب والدخول</button>
    <div id="iv-status" class="status"></div>
  </div>
</div>

<div id="dashboard" class="dashboard" hidden>
  <div class="welcome-card">
    <div class="welcome-text">
      <div class="welcome-hi">أهلاً بك 👋</div>
      <div class="welcome-name" id="welcome-name">—</div>
      <div class="welcome-sub" id="welcome-sub">—</div>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <nav class="tabs" id="tabs">
    <button class="active" data-view="cases">📁 قضاياي</button>
    <button data-view="agenda">📅 الجلسات</button>
    <button data-view="fees">💰 الأتعاب</button>
    <button data-view="invoices">📄 الفواتير</button>
  </nav>

  <main id="view-host"></main>
</div>

<div id="toast-host" class="toast-host"></div>

<!-- ✅ مسار مطلق عشان نضمن إنه بيقرأ من client/js/main.js مش js/main.js -->
<script type="module" src="/client/js/main.js?v=7"></script>
</body>
</html>
